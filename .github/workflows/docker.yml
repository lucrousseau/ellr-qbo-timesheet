name: Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp docker/.env.example docker/.env
          cp backend/.env.example backend/.env

      - name: Validate Compose file
        run: docker compose --env-file docker/.env config

      - name: Build images
        run: docker compose --env-file docker/.env build

      - name: Start stack
        run: docker compose --env-file docker/.env up -d

      - name: Smoke test
        run: sh scripts/docker-smoke.sh

      - name: Tear down
        if: always()
        run: docker compose --env-file docker/.env down -v
