# Deploy Ellr QBO Timesheet to SiteGround Shared over SSH/rsync (no FTP).
# Secrets live on the GitHub Environment "production" (not in this file).
#
# Always start the run from branch `main` (environment branch policy). Pass
# `git_ref` to deploy another tag or SHA (rollback). After a successful run the
# job creates an annotated tag `deploy-UTC` on the checked-out commit.
name: Deploy SiteGround

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: >-
          Git ref to deploy (tag, branch, or SHA). Leave empty to deploy the
          commit of the branch selected in Run workflow (use main).
        required: false
        type: string
      run_migrations:
        description: >-
          Run php artisan migrate --force. Leave on for a normal deploy. Turn
          off for rollback (migrations are not reversed).
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_API_URL: https://api.timesheet.ellr.ca/api
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Record deploy commit
        id: meta
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${sha} (run_migrations=${{ inputs.run_migrations }})"
          {
            echo "## SiteGround deploy"
            echo ""
            echo "- Commit: \`${sha}\`"
            echo "- Workflow branch: \`${{ github.ref_name }}\`"
            echo "- git_ref input: \`${{ inputs.git_ref || '(branch commit)' }}\`"
            echo "- run_migrations: \`${{ inputs.run_migrations }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Ensure commit is on main
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing to deploy $(git rev-parse HEAD): it is not an ancestor of origin/main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Sync password policy into backend
        run: sh scripts/sync-password-policy.sh

      - name: Build admin SPA
        run: npm run build:admin
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Build timesheet SPA
        run: npm run build:timesheet
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      # SiteGround keeps the web root as public_html/. Laravel code lives beside it;
      # public/ is synced separately into public_html/ (do not --delete public_html).
      - name: Deploy API app (beside public_html) via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avzr --delete
            --exclude .env
            --exclude .env.*
            --exclude vendor/
            --exclude node_modules/
            --exclude .git/
            --exclude storage/
            --exclude bootstrap/cache/
            --exclude public/
            --exclude public_html/
            --exclude tests/
            --exclude features/
            --exclude .phpunit.result.cache
            --exclude phpunit.xml
            --exclude phpstan.neon
            --exclude phpmd.xml
            --exclude .php-cs-fixer.php
          path: backend/
          remote_path: ${{ secrets.SG_PATH_API }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy API public/ into public_html via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: backend/public/
          remote_path: ${{ secrets.SG_PATH_API }}/public_html/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy admin SPA via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: apps/admin/dist/
          remote_path: ${{ secrets.SG_PATH_ADMIN }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy timesheet SPA via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: apps/timesheet/dist/
          remote_path: ${{ secrets.SG_PATH_TIMESHEET }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Composer install, Laravel caches, and SuperCacher purge
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.SG_PATH_API }}"
            if [ ! -f .env ]; then
              echo "Missing backend/.env on the server. Create it before deploying."
              exit 1
            fi
            PHP=/usr/local/php83/bin/php-cli
            mkdir -p storage/framework/{sessions,views,cache} storage/logs storage/app/public bootstrap/cache resources/views
            chmod -R ug+rwx storage bootstrap/cache
            "$PHP" -d memory_limit=512M /usr/local/bin/composer.phar install --no-dev --optimize-autoloader --no-interaction
            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              "$PHP" artisan migrate --force
            else
              echo "Skipping artisan migrate --force (run_migrations=false)"
            fi
            "$PHP" artisan config:cache
            "$PHP" artisan route:cache
            "$PHP" artisan view:cache
            # Purge SiteGround Dynamic Cache (SuperCacher) for all Ellr hosts.
            for host in timesheet.ellr.ca admin.timesheet.ellr.ca api.timesheet.ellr.ca; do
              body="$(curl -sS -X PURGE "http://127.0.0.1/*" -H "Host: ${host}")"
              echo "${body}" | grep -q "Successful purge"
              echo "Purged Dynamic Cache for ${host}"
            done

      - name: Tag successful production deploy
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="deploy-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${DEPLOY_SHA}" -m "SiteGround production deploy of ${DEPLOY_SHA} (migrations=${RUN_MIGRATIONS}) ${RUN_URL}"
          git push origin "refs/tags/${tag}"
          echo "- Tag: \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Created tag ${tag} on ${DEPLOY_SHA}"
