# Deploy Ellr QBO Timesheet to SiteGround Shared over SSH/rsync (no FTP).
# Requires repository secrets documented in docs/siteground-shared-hosting.md.
name: Deploy SiteGround

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_API_URL: https://api.timesheet.ellr.ca/api
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Sync password policy into backend
        run: sh scripts/sync-password-policy.sh

      - name: Build admin SPA
        run: npm run build:admin
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Build timesheet SPA
        run: npm run build:timesheet
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      # SiteGround keeps the web root as public_html/. Laravel code lives beside it;
      # public/ is synced separately into public_html/ (do not --delete public_html).
      - name: Deploy API app (beside public_html) via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude .env
            --exclude .env.*
            --exclude vendor/
            --exclude node_modules/
            --exclude .git/
            --exclude storage/
            --exclude bootstrap/cache/
            --exclude public/
            --exclude public_html/
            --exclude tests/
            --exclude features/
            --exclude .phpunit.result.cache
            --exclude phpunit.xml
            --exclude phpstan.neon
            --exclude phpmd.xml
            --exclude .php-cs-fixer.php
          path: backend/
          remote_path: ${{ secrets.SG_PATH_API }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy API public/ into public_html via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: backend/public/
          remote_path: ${{ secrets.SG_PATH_API }}/public_html/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy admin SPA via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: apps/admin/dist/
          remote_path: ${{ secrets.SG_PATH_ADMIN }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Deploy timesheet SPA via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: apps/timesheet/dist/
          remote_path: ${{ secrets.SG_PATH_TIMESHEET }}/
          remote_host: ${{ secrets.SG_SSH_HOST }}
          remote_port: ${{ secrets.SG_SSH_PORT }}
          remote_user: ${{ secrets.SG_SSH_USER }}
          remote_key: ${{ secrets.SG_SSH_PRIVATE_KEY }}

      - name: Composer install and Laravel caches
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SG_SSH_HOST }}
          port: ${{ secrets.SG_SSH_PORT }}
          username: ${{ secrets.SG_SSH_USER }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.SG_PATH_API }}"
            if [ ! -f .env ]; then
              echo "Missing backend/.env on the server. Create it before deploying."
              exit 1
            fi
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
