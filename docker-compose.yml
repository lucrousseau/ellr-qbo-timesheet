services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ellr}
      MYSQL_USER: ${MYSQL_USER:-ellr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ellr}
      DB_USERNAME: ${MYSQL_USER:-ellr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      FRONTEND_ADMIN_URL: http://localhost:5173
      FRONTEND_TIMESHEET_URL: http://localhost:5174
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:5174
      QUICKBOOKS_REDIRECT_URI: http://localhost:8000/api/quickbooks/callback
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

  node-init:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    entrypoint: ["/usr/local/bin/sync-node-deps.sh"]
    restart: "no"

  admin:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev --workspace=admin -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      node-init:
        condition: service_completed_successfully

  timesheet:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:${TIMESHEET_PORT:-5174}:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev --workspace=timesheet -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      node-init:
        condition: service_completed_successfully

volumes:
  mysql_data:
  api_vendor:
  node_modules:
