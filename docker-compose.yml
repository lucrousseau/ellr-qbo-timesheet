services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      APP_URL: http://localhost:8000
      DEV_SEED_ENABLED: "true"
      FRONTEND_ADMIN_URL: http://localhost:5173
      FRONTEND_TIMESHEET_URL: http://localhost:5174
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:5174
      QUICKBOOKS_REDIRECT_URI: http://localhost:8000/api/quickbooks/callback
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - ./packages/password-policy:/var/www/packages/password-policy:ro
      - api_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

  node-init:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    entrypoint: ["/usr/local/bin/sync-node-deps.sh"]
    restart: "no"

  admin:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    command: npm run dev --workspace=admin -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      node-init:
        condition: service_completed_successfully

  timesheet:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${TIMESHEET_PORT:-5174}:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    command: npm run dev --workspace=timesheet -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      node-init:
        condition: service_completed_successfully

volumes:
  api_vendor:
  node_modules:
  npm_cache:
